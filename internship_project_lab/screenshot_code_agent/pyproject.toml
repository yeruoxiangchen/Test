[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshot-code-agent"
version = "0.1.0"
description = "Screenshot tools, isolated repository repair and independent patch verification on CoreCoder"
requires-python = ">=3.10"
dependencies = ["corecoder==0.8.0", "openai>=1.30,<3", "Pillow>=10,<13", "pydantic>=2.6,<3"]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime==1.4.4"]
dev = ["pytest>=7,<10", "ruff>=0.9"]
benchmark = ["pyarrow>=18,<24", "python-Levenshtein>=0.26,<1", "unidiff>=0.7,<1", "tiktoken>=0.8,<1"]

[project.scripts]
sca = "screenshot_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sandbox: requires functional Bubblewrap user namespaces"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
