[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-kb-agent"
version = "0.1.0"
description = "Local enterprise knowledge workspace with a bounded, auditable tool-calling agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1", "pypdf>=5,<7", "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "playwright>=1.48,<2"]

[project.scripts]
knowledge-desk = "kb.cli:main"

[tool.setuptools.packages.find]
include = ["kb*"]

[tool.setuptools.package-data]
kb = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
